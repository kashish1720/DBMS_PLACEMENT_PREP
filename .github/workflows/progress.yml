name: Update Progress

on:
  issues:
    types: [edited]

permissions:
  contents: write

jobs:
  update:
    # Sirf tracker issue par chalega
    if: contains(github.event.issue.title, 'Progress Tracker')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README progress
        run: python3 .github/scripts/update_progress.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: auto-update progress"
            git push
          fi
